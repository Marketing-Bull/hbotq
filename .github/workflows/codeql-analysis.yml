name: "CodeQL Analysis"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"  # Weekly scan every Sunday at midnight

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # docs/migration/raw-html is a byte-for-byte archive of the old
          # WordPress site, kept so the pre-migration content survives the DNS
          # cutover. It carries ~700 inline WordPress/Elementor/jQuery script
          # blocks that CodeQL flags as vulnerable third-party code. None of it
          # is built, executed, or deployed — it is inert reference material —
          # so it is scoped out rather than triaged. Everything we actually
          # ship stays in scope.
          config: |
            paths-ignore:
              - docs/migration/raw-html

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          output: |
            codeql-results.${{ matrix.language }}.sarif
