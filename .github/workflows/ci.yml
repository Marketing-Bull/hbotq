name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same branch/PR — only the newest commit matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build & validate schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative and the
      # job fails if package.json and package-lock.json have drifted.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` also runs the TypeScript check, so this covers type errors
      # as well as build breaks. Vercel builds previews too, but this gates the
      # merge instead of only reporting after the fact.
      - name: Build
        run: npm run build

      # Validates every JSON-LD block in the build output against schema.org
      # rules (see scripts/validate-schema.mjs). Depends on the build above
      # having produced .next/server/app.
      - name: Validate structured data
        run: npm run validate:schema
